name: windows-arm64

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build compiler
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ender-windows-arm64
          path: ender.exe

  test:
    needs: build
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ender-windows-arm64
      - name: Version
        shell: pwsh
        run: ./ender.exe --version
      - name: Hello world
        shell: pwsh
        run: |
          Set-Content -Path hello.es -Value 'print>>"Hello World"' -NoNewline
          ./ender.exe build hello.es
          ./hello.exe
      - name: Tests
        shell: pwsh
        run: ./tests/run_tests.ps1 -Compiler ./ender.exe
      - name: Runtime division by zero
        shell: pwsh
        run: |
          Set-Content -Path divzero.es -Value "a.int = 10`nb.int = 0`nc.int = a / b`n" -NoNewline
          ./ender.exe build divzero.es
          ./divzero.exe
          if ($LASTEXITCODE -ne 1) { exit 1 } else { exit 0 }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Fuzz arithmetic
        shell: pwsh
        run: |
          foreach ($s in 1..20) {
            python tests/fuzz_expr.py ./ender.exe $s 400
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
