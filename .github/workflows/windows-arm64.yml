name: windows-arm64

on:
  push:
    paths:
      - 'Windows-ARM64ES/**'
      - '.github/workflows/windows-arm64.yml'
  pull_request:
    paths:
      - 'Windows-ARM64ES/**'
      - '.github/workflows/windows-arm64.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: Windows-ARM64ES

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build compiler
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ender-windows-arm64
          path: Windows-ARM64ES/ender.exe

  test:
    needs: build
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ender-windows-arm64
          path: Windows-ARM64ES
      - name: Version
        shell: pwsh
        run: ./ender.exe --version
      - name: Hello world
        shell: pwsh
        run: |
          Set-Content -Path hello.es -Value 'print>>"Hello World"' -NoNewline
          ./ender.exe hello.es
          ./ender.exe run hello.es
          ./ender.exe examine hello.es
      - name: Runtime division by zero
        shell: pwsh
        run: |
          Set-Content -Path divzero.es -Value "a.int = 10`nb.int = 0`nc.int = a / b`n" -NoNewline
          ./ender.exe divzero.es
          if ($LASTEXITCODE -ne 1) { exit 1 } else { exit 0 }
      - name: Runtime array index
        shell: pwsh
        run: |
          Set-Content -Path badidx.es -Value "a.int[3] = 1, 2, 3`ni.int = 4`nprint>>a[i]`n" -NoNewline
          ./ender.exe badidx.es 2> err.txt
          if ($LASTEXITCODE -ne 1) { exit 1 }
          if (-not (Select-String -Path err.txt -Pattern 'array index out of range on line 3' -Quiet)) { exit 1 }
          exit 0
