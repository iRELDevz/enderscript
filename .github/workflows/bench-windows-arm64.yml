name: bench-windows-arm64

on:
  workflow_dispatch:
  push:
    paths:
      - 'Windows-ARM64ES/bench/**'
      - '.github/workflows/bench-windows-arm64.yml'

defaults:
  run:
    working-directory: Windows-ARM64ES

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build compiler
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ender-windows-arm64
          path: Windows-ARM64ES/ender.exe

  bench:
    needs: build
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ender-windows-arm64
          path: Windows-ARM64ES
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Machine
        shell: pwsh
        run: (Get-CimInstance Win32_Processor).Name
      - name: Benchmark
        shell: pwsh
        run: python -u bench/bench_all.py ./ender.exe windows-arm64 es,python,node
        env:
          BENCH_DIR: benchwork
      - uses: actions/upload-artifact@v4
        with:
          name: bench-windows-arm64
          path: Windows-ARM64ES/benchwork/result_windows-arm64.json
