name: bench-windows-arm64

on:
  workflow_dispatch:
  push:
    paths:
      - 'bench/**'
      - '.github/workflows/bench.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build compiler
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ender-windows-arm64
          path: ender.exe

  bench:
    needs: build
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ender-windows-arm64
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Machine
        shell: pwsh
        run: (Get-CimInstance Win32_Processor).Name
      - name: Benchmark
        shell: pwsh
        run: python -u bench/bench_all.py ./ender.exe windows-arm64 es,python,node
        env:
          BENCH_DIR: benchwork
      - uses: actions/upload-artifact@v4
        with:
          name: bench-windows-arm64
          path: benchwork/result_windows-arm64.json
